
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#262626">

  <title>SunBox | Login Log Approval</title>

  <style>
    :root {
      --background: #262626;
      --card: #292929;
      --orange: #e9a64b;
      --white: #ffffff;
      --muted: #b7b7b7;
      --border: #555555;
      --success: #95dfab;
      --error: #ff9c9c;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #262626;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 145px 18px 90px;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);

      background: linear-gradient(
        to bottom,
        #262626 0%,
        #262626 55%,
        #48382b 73%,
        #9e7040 87%,
        #e9a64b 100%
      );

      background-attachment: fixed;
    }

    /* ONE LARGE ROUNDED CARD */

    .main-card {
      position: relative;

      width: 100%;
      max-width: 430px;
      min-height: 670px;

      padding: 128px 30px 45px;

      background: var(--card);
      border-radius: 34px;

      box-shadow:
        0 22px 42px rgba(0, 0, 0, 0.28);

      text-align: center;
    }

    /* LOGO OVERLAPS TOP BORDER */

    .logo-area {
      position: absolute;

      top: -95px;
      left: 50%;
      transform: translateX(-50%);

      width: 190px;
      height: 190px;

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 2;
      pointer-events: none;
    }

    .floating-logo {
      display: block;

      width: 190px;
      height: 190px;

      object-fit: contain;

      filter: drop-shadow(
        0 10px 12px rgba(0, 0, 0, 0.22)
      );

      animation: floatMascot 3s ease-in-out infinite;
    }

    @keyframes floatMascot {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* SUNBOX TITLE */

    .welcome {
      margin: 0;
      color: #b0b0b0;

      font-size: 19px;
      font-weight: 400;
    }

    .brand-name {
      margin: 12px 0 35px;

      color: var(--white);
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -1.3px;
      line-height: 1.1;
    }

    /* APPROVAL INFORMATION */

    .section-heading {
      margin: 0 0 12px;

      color: var(--white);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.4;
    }

    .description {
      margin: 0 0 30px;

      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .field-label {
      display: block;

      margin-bottom: 12px;

      color: #eeeeee;
      font-size: 16px;
      text-align: left;
    }

    .log-box {
      padding: 19px 18px;

      background: #252525;
      border: 2px solid #555555;
      border-radius: 12px;
    }

    .log-count {
      margin: 0 0 8px;

      color: var(--white);
      font-size: 39px;
      font-weight: 800;
    }

    .verification {
      color: var(--orange);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
    }

    /* REQUEST STATUS */

    #status {
      min-height: 46px;

      margin: 23px 0 27px;

      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #status.success {
      color: var(--success);
    }

    #status.error {
      color: var(--error);
    }

    /* ORANGE APPROVAL BUTTON */

    .approve-button {
      display: block;

      width: 100%;
      max-width: 245px;
      min-height: 55px;

      margin: 0 auto;
      padding: 14px 16px;

      border: none;
      border-radius: 999px;

      background: var(--orange);
      color: #292929;

      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;

      cursor: pointer;
      transition: background 0.2s ease;
    }

    .approve-button:hover:not(:disabled) {
      background: #f4b85f;
    }

    .approve-button:disabled {
      background: #666666;
      color: #dddddd;
      cursor: not-allowed;
    }

    /* DIVIDER AND FOOTNOTE */

    .divider {
      height: 1px;

      margin: 40px 0 19px;

      background: var(--border);
    }

    .security-note {
      margin: 0;

      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    /* SMALL PHONE SCREENS */

    @media (max-width: 480px) {
      body {
        padding: 128px 14px 85px;
      }

      .main-card {
        min-height: 650px;
        padding: 117px 24px 39px;
        border-radius: 31px;
      }

      .logo-area {
        top: -88px;
        width: 176px;
        height: 176px;
      }

      .floating-logo {
        width: 176px;
        height: 176px;
      }

      .welcome {
        font-size: 18px;
      }

      .brand-name {
        font-size: 43px;
        margin-bottom: 34px;
      }

      .section-heading {
        font-size: 18px;
      }

      .description {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-logo {
        animation: none;
      }

      .approve-button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="main-card">

    <!-- HALF OUTSIDE, HALF INSIDE THE CARD -->

    <div class="logo-area">
      <img
        src="./sunbox-logo.png"
        alt="SunBox Official Logo"
        class="floating-logo"
      >
    </div>

    <!-- SUNBOX HEADING -->

    <p class="welcome">
      Welcome to
    </p>

    <h1 class="brand-name">
      SunBox
    </h1>

    <!-- APPROVAL DETAILS -->

    <h2 class="section-heading">
      Login Log Deletion Approval
    </h2>

    <p class="description">
      Review your retention request before
      permanently deleting eligible login logs.
    </p>

    <label class="field-label" for="count">
      Eligible Login Logs
    </label>

    <div class="log-box">

      <div class="log-count" id="count">
        —
      </div>

      <div
        class="verification"
        id="verification"
      >
        Verifying request...
      </div>

    </div>

    <p
      id="status"
      role="status"
      aria-live="polite"
    >
      Checking approval request...
    </p>

    <!-- PERMANENT DELETION BUTTON -->

    <button
      class="approve-button"
      id="approveButton"
      type="button"
      disabled
    >
      Approve Permanent Deletion
    </button>

    <div class="divider"></div>

    <p class="security-note">
      Only login logs included in this approved
      request can be permanently deleted.
      This action cannot be undone.
    </p>

  </main>

  <!-- EXISTING SUPABASE APPROVAL LOGIC -->

  <script>
    const apiUrl =
      "https://xhszzxngfcxvbdouorbo.supabase.co/functions/v1/approve-login-log-deletion";

    const token = new URLSearchParams(
      window.location.search
    ).get("token");

    const status = document.getElementById("status");
    const count = document.getElementById("count");
    const verification =
      document.getElementById("verification");
    const button =
      document.getElementById("approveButton");

    let verifiedCount = null;
    let requestFinished = false;

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = type;
    }

    async function verifyApproval() {
      if (!token || !/^[a-f0-9]{64}$/.test(token)) {
        verification.textContent = "Invalid link";
        setStatus("Invalid approval link.", "error");
        return;
      }

      try {
        const response = await fetch(
          apiUrl + "?token=" + encodeURIComponent(token),
          {
            method: "GET",
            cache: "no-store"
          }
        );

        const data = await response.json();

        if (!response.ok || !data.valid) {
          verification.textContent =
            "Verification failed";

          setStatus(
            data.message ||
            "Invalid or expired approval link.",
            "error"
          );

          return;
        }

        verifiedCount = data.eligible_log_count;

        count.textContent = String(verifiedCount);
        verification.textContent = "✓ Request verified";

        setStatus(
          "Approval request verified. Please review carefully."
        );

        button.disabled = false;

      } catch (error) {
        verification.textContent = "Unable to verify";

        setStatus(
          "Unable to verify approval request. Please try again later.",
          "error"
        );
      }
    }

    button.addEventListener("click", async () => {
      if (button.disabled || requestFinished) {
        return;
      }

      const confirmed = window.confirm(
        "Do you explicitly approve permanent deletion of " +
        verifiedCount +
        " eligible Login Log(s)?\n\n" +
        "This action cannot be undone."
      );

      if (!confirmed) return;

      button.disabled = true;
      button.textContent = "Processing Approval...";

      setStatus(
        "Recording approval and processing deletion..."
      );

      try {
        const response = await fetch(
          apiUrl + "?token=" + encodeURIComponent(token),
          {
            method: "POST",
            cache: "no-store"
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          verification.textContent =
            data.approved
              ? "Approval recorded"
              : "Approval unsuccessful";

          setStatus(
            data.message ||
            "Unable to process approval.",
            "error"
          );

          button.textContent = "Approval Status Uncertain";
          button.disabled = true;
          return;
        }

        requestFinished = true;

        verification.textContent = "✓ Deletion completed";
        count.textContent = "0";

        setStatus(
          data.message ||
          "Approved Login Logs permanently deleted.",
          "success"
        );

        button.textContent = "Deletion Completed";
        button.disabled = true;

        history.replaceState(
          null,
          "",
          location.pathname
        );

      } catch (error) {
        verification.textContent =
          "Status needs verification";

        setStatus(
          "The request may have been processed. " +
          "Please verify its status before trying again.",
          "error"
        );

        button.textContent = "Approval Status Uncertain";
        button.disabled = true;
      }
    });

    verifyApproval();
  </script>

</body>
</html>
