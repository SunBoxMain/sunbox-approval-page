
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SunBox Login Log Approval</title>
</head>
<body style="font-family:Arial,sans-serif;text-align:center;padding:50px;">
  <h2>SunBox Login Log Deletion</h2>
  <p>Review your deletion approval request.</p>
  <p id="status">Checking approval request...</p>

  <button disabled
    style="background:#999;color:white;padding:12px 20px;border:0;border-radius:6px;">
    Approve Permanent Deletion
  </button>

  <p>No Login Logs have been deleted.</p>
  
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const status = document.getElementById("status");

  if (!token || !/^[a-f0-9]{64}$/.test(token)) {
    status.textContent = "Invalid approval link.";
  } else {
    status.textContent = "Approval link detected. Verification pending.";
  }
</script>

</body>
</html>
