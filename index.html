
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#262626">

  <title>SunBox | Login Log Approval</title>

  <style>
    :root {
      --background: #262626;
      --card: #282828;
      --field: #252525;
      --border: #5b5b5b;
      --orange: #e9a64b;
      --orange-hover: #f3b75d;
      --white: #ffffff;
      --muted: #b6b6b6;
      --success: #95dfab;
      --error: #ff9c9c;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #262626;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 40px 18px 110px;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);

      background: linear-gradient(
        to bottom,
        #262626 0%,
        #262626 58%,
        #3b3128 70%,
        #88603a 84%,
        #e9a64b 100%
      );
      background-attachment: fixed;
    }

    /* LARGE SUNBOX LOGIN-STYLE CARD */

    .main-card {
      width: 100%;
      max-width: 430px;
      margin: 30px auto 0;
      padding: 52px 30px 48px;

      background: var(--card);
      border-radius: 36px;

      box-shadow:
        0 22px 38px rgba(0, 0, 0, 0.28);

      text-align: center;
    }

    /* FLOATING MASCOT */

    .logo-area {
      display: flex;
      align-items: center;
      justify-content: center;

      height: 210px;
      margin-bottom: 20px;
    }

    .floating-logo {
      display: block;
      width: 195px;
      height: 195px;
      object-fit: contain;

      filter: drop-shadow(
        0 12px 15px rgba(0, 0, 0, 0.25)
      );

      animation: floatMascot 3s ease-in-out infinite;
    }

    @keyframes floatMascot {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-13px);
      }
    }

    /* WELCOME TEXT */

    .welcome {
      margin: 0;
      color: #a9a9a9;
      font-size: 20px;
      font-weight: 400;
    }

    .brand-name {
      margin: 12px 0 42px;

      color: #ffffff;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.15;
    }

    /* APPROVAL DETAILS */

    .section-heading {
      margin: 0 0 12px;
      color: var(--white);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
    }

    .description {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .field-label {
      display: block;
      margin-bottom: 13px;

      color: #e5e5e5;
      font-size: 17px;
      font-weight: 400;
      text-align: left;
    }

    /* LOGIN LOG BOX */

    .log-box {
      padding: 20px 18px;
      background: var(--field);
      border: 2px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .log-count {
      margin: 0 0 8px;
      color: var(--white);
      font-size: 39px;
      font-weight: 800;
    }

    .verification {
      color: var(--orange);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
    }

    /* STATUS */

    #status {
      min-height: 48px;
      margin: 23px 0 27px;

      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #status.success {
      color: var(--success);
    }

    #status.error {
      color: var(--error);
    }

    /* ORANGE PILL BUTTON */

    .approve-button {
      display: block;
      width: 100%;
      max-width: 235px;
      min-height: 55px;

      margin: 0 auto;
      padding: 14px 16px;

      border: none;
      border-radius: 999px;

      background: var(--orange);
      color: #292929;

      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;

      cursor: pointer;
      transition: background 0.2s ease;
    }

    .approve-button:hover:not(:disabled) {
      background: var(--orange-hover);
    }

    .approve-button:disabled {
      background: #666666;
      color: #dddddd;
      cursor: not-allowed;
    }

    /* BOTTOM DIVIDER */

    .divider {
      height: 1px;
      margin: 42px 0 20px;
      background: #555555;
    }

    .security-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    /* MOBILE */

    @media (max-width: 480px) {
      body {
        padding: 24px 14px 100px;
      }

      .main-card {
        margin-top: 15px;
        padding: 43px 24px 40px;
        border-radius: 32px;
      }

      .logo-area {
        height: 190px;
        margin-bottom: 18px;
      }

      .floating-logo {
        width: 185px;
        height: 185px;
      }

      .welcome {
        font-size: 18px;
      }

      .brand-name {
        font-size: 44px;
        margin-bottom: 38px;
      }

      .section-heading {
        font-size: 18px;
      }

      .description {
        font-size: 13px;
      }

      .field-label {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-logo {
        animation: none;
      }

      .approve-button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- ONE LARGE CARD LIKE SUNBOX LOGIN -->

  <main class="main-card">

    <!-- FLOATING SUNBOX MASCOT -->

    <div class="logo-area">
      <img
        src="./sunbox-logo.png"
        alt="SunBox Official Logo"
        class="floating-logo"
      >
    </div>

    <!-- WELCOME TO SUNBOX -->

    <p class="welcome">
      Welcome to
    </p>

    <h1 class="brand-name">
      SunBox
    </h1>

    <!-- APPROVAL CONTENT -->

    <h2 class="section-heading">
      Login Log Deletion Approval
    </h2>

    <p class="description">
      Review your retention request before
      permanently deleting eligible login logs.
    </p>

    <label class="field-label" for="count">
      Eligible Login Logs
    </label>

    <div class="log-box">

      <div class="log-count" id="count">
        —
      </div>

      <div
        class="verification"
        id="verification"
      >
        Verifying request...
      </div>

    </div>

    <p
      id="status"
      role="status"
      aria-live="polite"
    >
      Checking approval request...
    </p>

    <!-- APPROVAL BUTTON -->

    <button
      class="approve-button"
      id="approveButton"
      type="button"
      disabled
    >
      Approve Permanent Deletion
    </button>

    <!-- BOTTOM LINE LIKE LOGIN SCREEN -->

    <div class="divider"></div>

    <p class="security-note">
      Only login logs included in this approved
      request can be permanently deleted.
      This action cannot be undone.
    </p>

  </main>

  <!-- EXISTING SUPABASE APPROVAL FUNCTIONALITY -->

  <script>
    const apiUrl =
      "https://xhszzxngfcxvbdouorbo.supabase.co/functions/v1/approve-login-log-deletion";

    const token = new URLSearchParams(
      window.location.search
    ).get("token");

    const status = document.getElementById("status");
    const count = document.getElementById("count");
    const verification =
      document.getElementById("verification");
    const button =
      document.getElementById("approveButton");

    let verifiedCount = null;
    let requestFinished = false;

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = type;
    }

    async function verifyApproval() {
      if (!token || !/^[a-f0-9]{64}$/.test(token)) {
        verification.textContent = "Invalid link";
        setStatus("Invalid approval link.", "error");
        return;
      }

      try {
        const response = await fetch(
          apiUrl + "?token=" + encodeURIComponent(token),
          {
            method: "GET",
            cache: "no-store"
          }
        );

        const data = await response.json();

        if (!response.ok || !data.valid) {
          verification.textContent =
            "Verification failed";

          setStatus(
            data.message ||
            "Invalid or expired approval link.",
            "error"
          );

          return;
        }

        verifiedCount = data.eligible_log_count;

        count.textContent = String(verifiedCount);
        verification.textContent = "✓ Request verified";

        setStatus(
          "Approval request verified. Please review carefully."
        );

        button.disabled = false;

      } catch (error) {
        verification.textContent = "Unable to verify";

        setStatus(
          "Unable to verify approval request. Please try again later.",
          "error"
        );
      }
    }

    button.addEventListener("click", async () => {
      if (button.disabled || requestFinished) {
        return;
      }

      const confirmed = window.confirm(
        "Do you explicitly approve permanent deletion of " +
        verifiedCount +
        " eligible Login Log(s)?\n\n" +
        "This action cannot be undone."
      );

      if (!confirmed) return;

      button.disabled = true;
      button.textContent = "Processing Approval...";

      setStatus(
        "Recording approval and processing deletion..."
      );

      try {
        const response = await fetch(
          apiUrl + "?token=" + encodeURIComponent(token),
          {
            method: "POST",
            cache: "no-store"
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          verification.textContent =
            data.approved
              ? "Approval recorded"
              : "Approval unsuccessful";

          setStatus(
            data.message ||
            "Unable to process approval.",
            "error"
          );

          button.textContent = "Approval Status Uncertain";
          button.disabled = true;
          return;
        }

        requestFinished = true;

        verification.textContent = "✓ Deletion completed";
        count.textContent = "0";

        setStatus(
          data.message ||
          "Approved Login Logs permanently deleted.",
          "success"
        );

        button.textContent = "Deletion Completed";
        button.disabled = true;

        // Remove approval token from the visible URL.
        history.replaceState(
          null,
          "",
          location.pathname
        );

      } catch (error) {
        verification.textContent =
          "Status needs verification";

        setStatus(
          "The request may have been processed. " +
          "Please verify its status before trying again.",
          "error"
        );

        button.textContent = "Approval Status Uncertain";
        button.disabled = true;
      }
    });

    verifyApproval();
  </script>

</body>
</html>
